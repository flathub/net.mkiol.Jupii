app-id: net.mkiol.Jupii
runtime: org.kde.Platform
runtime-version: "5.15-25.08"
sdk: org.kde.Sdk
rename-icon: jupii
command: jupii
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all # v4l2 webcams
  - --filesystem=xdg-desktop
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-documents
  - --filesystem=xdg-videos
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Tracker1.Steroids # media files index
  - --talk-name=org.freedesktop.Tracker3.Endpoint # media files index
  - --talk-name=org.kde.StatusNotifierWatcher # system tray icon
  - --env=QT_QUICK_CONTROLS_STYLE=org.kde.desktop
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/bash-completion
  - /share/doc
  - /share/fish
  - /share/man
  - /share/zsh
  - "*.a"
  - "*.la"
modules:
  - name: gumbo
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/google/gumbo-parser/archive/refs/tags/v0.10.1.tar.gz
        sha256: 28463053d44a5dfbc4b77bcf49c8cee119338ffa636cc17fc3378421d714efad

  - name: mhd
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --disable-examples
      - --disable-curl
      - --disable-https
      - --disable-postprocessor
      - --disable-dauth
      - --disable-bauth
      - --disable-epoll
      - --disable-sendfile
      - --disable-httpupgrade
      - --disable-static
    sources:
      - type: archive
        url: https://ftpmirror.gnu.org/libmicrohttpd/libmicrohttpd-0.9.77.tar.gz
        sha256: 9e7023a151120060d2806a6ea4c13ca9933ece4eacfc5c9464d20edddb76b0a0

  - name: npupnp
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Ddefault_library=static
    sources:
      - type: archive
        url: https://www.lesbonscomptes.com/upmpdcli/downloads/libnpupnp-6.2.1.tar.gz
        sha256: 1cc1222512d480826d2923cc7b98b7361183a2add8c6b646a7fa32c2f34b32b3

  - name: upnpp
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Ddefault_library=static
    sources:
      - type: archive
        url: https://www.lesbonscomptes.com/upmpdcli/downloads/libupnpp-0.26.8.tar.gz
        sha256: fc7e253b63b21f5638c73f5940c67111ffc93e018e8c7acc4f51333d78616eed

  - name: pybind11
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPYBIND11_INSTALL=ON
      - -DPYBIND11_TEST=OFF
      - -DPYBIND11_FINDPYTHON=ON
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/pybind/pybind11/archive/refs/tags/v2.13.6.tar.gz
        sha256: e08cb87f4773da97fa7b5f035de8763abc656d87d5773e62f6da0587d1f0ec20

  - python3-modules.yaml

  - name: jupii
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_FLATPAK=ON
      - -DWITH_DESKTOP=ON
      - -DBUILD_FFMPEG=OFF
      - -DBUILD_FMT=OFF
      - -DBUILD_GUMBO=OFF
      - -DBUILD_UPNPP=OFF
      - -DBUILD_TAGLIB=OFF
      - -DBUILD_LIBARCHIVE=OFF
      - -DBUILD_XZ=OFF
      - -DBUILD_PYBIND11=OFF
      - -DBUILD_CATCH2=OFF
    build-options:
      arch:
        aarch64:
          config-opts:
            - -DWITH_NVENC=OFF
    sources:
      - type: git
        url: https://github.com/mkiol/Jupii.git
        commit: 1562a459ea711c6c1a9f767a41bb9189ba550700
